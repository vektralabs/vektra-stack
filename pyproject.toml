# Resolution constraint, not a dependency: nothing here imports numpy directly,
# but the deployment target does. The production VM's CPU predates x86-64-v2
# (it has SSE4.2 but no POPCNT), and every numpy >= 2.0 x86_64 wheel on PyPI is
# built with an X86_V2 baseline, so `import numpy` aborts the process before any
# Vektra code runs. numpy 1.26 wheels keep the SSE3 baseline. See
# docs/getting-started/index.md#cpu-requirements and the guard in
# vektra-index/tests/test_numpy_cpu_baseline.py.
[tool.uv]
constraint-dependencies = ["numpy<2"]
# Every image and CI job runs Python 3.12. Without this bound the numpy<2 constraint
# has no solution for pillow>=12.3 on the 3.13+ forks, and upgrading pillow silently
# collapses to 10.4.0 for every Python, 3.12 included (DEBT-039).
environments = ["python_version < '3.13'"]

[tool.uv.workspace]
members = ["vektra-shared", "vektra-core", "vektra-ingest", "vektra-index", "vektra-admin", "vektra-analytics", "vektra-learn", "vektra-assess", "vektra-app"]

# PyTorch CPU-only index for CI and development (no NVIDIA CUDA packages).
# Only used by packages with an explicit source override (explicit = true).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "import-linter>=2.13",
]

# ---------------------------------------------------------------------------
# Ruff: linter and formatter (replaces flake8, isort, black)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernize syntax)
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length enforced by formatter, not linter
    "B008",   # FastAPI requires Depends()/Security() in function signature defaults
    "B904",   # raise-without-from-inside-except: pre-existing pattern, intentional for HTTP errors
    "B905",   # zip-without-explicit-strict: pre-existing pattern
    "UP042",  # StrEnum migration deferred (may affect serialization behavior)
    "RUF012", # ClassVar annotation not required for arq/pytest class-level config attrs
]

[tool.ruff.lint.isort]
known-first-party = [
    "vektra_shared",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_admin",
    "vektra_app",
    "vektra_analytics",
    "vektra_learn",
    "vektra_assess",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: type checking with SQLAlchemy 2.0 plugin
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Third-party libraries without complete stubs
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "asyncpg",
    "asyncpg.*",
    "pdfplumber.*",
    "magic.*",
    "sentence_transformers.*",
    "pgvector.*",
    "arq.*",
    "pptx.*",
    "docx.*",
    "testcontainers.*",
    "psutil.*",
    "uvicorn.*",
    "qdrant_client",
    "qdrant_client.*",
    "fastembed",
    "fastembed.*",
    "unstructured",
    "unstructured.*",
    "cachetools",
    "cachetools.*",
    "defusedxml",
    "defusedxml.*",
    "html5lib",
    "html5lib.*",
    "pdfminer",
    "pdfminer.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

# Tests: relax strictness (no type annotations required)
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# import-linter: module boundary enforcement (replaces .importlinter)
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "vektra_shared",
    "vektra_admin",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_analytics",
    "vektra_app",
    "vektra_learn",
    "vektra_assess",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "vektra_shared must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_shared"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_analytics", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_admin must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_admin"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_core must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_core"]
forbidden_modules = ["vektra_admin", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_ingest must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_ingest"]
forbidden_modules = ["vektra_admin", "vektra_core", "vektra_index", "vektra_analytics", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_index must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_index"]
forbidden_modules = ["vektra_admin", "vektra_core", "vektra_ingest", "vektra_analytics", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_analytics must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_analytics"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_learn", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "vektra_learn must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_learn"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_analytics", "vektra_app", "vektra_assess"]

[[tool.importlinter.contracts]]
name = "No component shall import the app entrypoint"
type = "forbidden"
source_modules = ["vektra_shared", "vektra_admin", "vektra_core", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn", "vektra_assess"]
forbidden_modules = ["vektra_app"]

# --- vektra_assess (ARCH-073, adapted: see plan assess-foundations Design Notes) ---

# (a) the assess vertical and the learn vertical do not know each other
[[tool.importlinter.contracts]]
name = "vektra_assess and vektra_learn are independent"
type = "independence"
modules = ["vektra_assess", "vektra_learn"]

# (b) assess imports no other component; the LLM provider, safeguard and trace writer
# are injected by the composition roots in vektra_app (create_app, assess_worker)
[[tool.importlinter.contracts]]
name = "vektra_assess must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_assess"]
forbidden_modules = ["vektra_core", "vektra_analytics", "vektra_learn", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_app"]

# (c) only the worker reaches Moodle and the parser sidecar. The source list must equal
# the assess sub-packages/modules minus worker, moodle, parser_client: a test in
# vektra-assess/tests/test_boundaries.py fails when a new one is not listed here.
[[tool.importlinter.contracts]]
name = "only vektra_assess.worker imports vektra_assess.moodle and parser_client"
type = "forbidden"
source_modules = ["vektra_assess.api", "vektra_assess.context", "vektra_assess.llm", "vektra_assess.transcript", "vektra_assess.delivery", "vektra_assess.crypto", "vektra_assess.db", "vektra_assess.health", "vektra_assess.config", "vektra_assess.keys", "vektra_assess.errors", "vektra_assess.readable", "vektra_assess.capabilities", "vektra_assess.jobs", "vektra_assess.audit", "vektra_assess.tokens", "vektra_assess.gates", "vektra_assess.turn_markers", "vektra_assess.timing", "vektra_assess.start_rules", "vektra_assess.ui", "vektra_assess.parser_protocol", "vektra_assess.parser_sidecar"]
forbidden_modules = ["vektra_assess.moodle", "vektra_assess.worker.parser_client"]
# the one exception (plan assess-context): worker-only capture code lives in
# vektra_assess.context.capture, and the next contract keeps it reachable from the worker only
ignore_imports = [
    "vektra_assess.context.capture.** -> vektra_assess.moodle",
    "vektra_assess.context.capture.** -> vektra_assess.moodle.**",
    "vektra_assess.context.capture.** -> vektra_assess.worker.parser_client",
]
# capture is built task by task: an exception that is not used yet is not an error
unmatched_ignore_imports_alerting = "none"

# (c-ctx) capture reads Moodle and the parser: only the worker may import it, never the API or the
# API-importable half of vektra_assess.context (snapshot, policy, assembly, Part A, payload)
[[tool.importlinter.contracts]]
name = "only vektra_assess.worker imports vektra_assess.context.capture"
type = "forbidden"
# "vektra_assess.context.*", not "vektra_assess.context": import-linter SKIPS a source that contains
# the forbidden module ("overlapping modules"), so the parent package would check nothing. The
# wildcard checks every child of context; capture itself overlaps and is skipped, as intended.
source_modules = ["vektra_assess.api", "vektra_assess.context.*", "vektra_assess.llm", "vektra_assess.transcript", "vektra_assess.delivery", "vektra_assess.crypto", "vektra_assess.db", "vektra_assess.health", "vektra_assess.config", "vektra_assess.keys", "vektra_assess.errors", "vektra_assess.readable", "vektra_assess.capabilities", "vektra_assess.jobs", "vektra_assess.audit", "vektra_assess.tokens", "vektra_assess.gates", "vektra_assess.turn_markers", "vektra_assess.timing", "vektra_assess.start_rules", "vektra_assess.ui", "vektra_assess.parser_protocol", "vektra_assess.parser_sidecar", "vektra_assess.moodle", "vektra_app.main"]
forbidden_modules = ["vektra_assess.context.capture"]

# (d) the only constructor of ContextBundle is private to vektra_assess.context (plan assess-context):
# nothing outside the package may import vektra_assess.context._assembly. Reaching it through the
# public ``vektra_assess.context.assemble.assemble_context`` is the designed path (the worker
# pre-flight and the API turn route assemble bundles, plan assess-session-lifecycle), hence
# indirect imports are allowed and only a direct import breaks the contract.
[[tool.importlinter.contracts]]
name = "vektra_assess.context._assembly is private to vektra_assess.context"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["vektra_assess.api", "vektra_assess.llm", "vektra_assess.transcript", "vektra_assess.delivery", "vektra_assess.crypto", "vektra_assess.db", "vektra_assess.health", "vektra_assess.config", "vektra_assess.keys", "vektra_assess.errors", "vektra_assess.readable", "vektra_assess.capabilities", "vektra_assess.jobs", "vektra_assess.audit", "vektra_assess.tokens", "vektra_assess.gates", "vektra_assess.turn_markers", "vektra_assess.timing", "vektra_assess.start_rules", "vektra_assess.ui", "vektra_assess.parser_protocol", "vektra_assess.parser_sidecar", "vektra_assess.moodle", "vektra_assess.worker", "vektra_app"]
forbidden_modules = ["vektra_assess.context._assembly"]

# (d-ctx) the model context holds no vector store, retrieval or HTTP client: structural NFR-015
# evidence (RAG OFF means no path to a retriever). Capture reaches Moodle through the readers, which
# use httpx: those edges are the one exception.
[[tool.importlinter.contracts]]
name = "vektra_assess.context imports no retrieval stack and no HTTP client"
type = "forbidden"
source_modules = ["vektra_assess.context"]
forbidden_modules = ["vektra_index", "vektra_core", "vektra_ingest", "qdrant_client", "httpx"]
ignore_imports = [
    "vektra_assess.context.capture.** -> vektra_assess.moodle",
    "vektra_assess.context.capture.** -> vektra_assess.moodle.**",
    "vektra_assess.context.capture.** -> vektra_assess.worker.parser_client",
]
unmatched_ignore_imports_alerting = "none"

# (llm) the discussion runner reaches no retrieval, analytics or ML stack (plan assess-llm-runner,
# NFR-015 structural evidence): the LLM provider, safeguard and trace writer are injected by vektra_app
[[tool.importlinter.contracts]]
name = "vektra_assess.llm imports no retrieval, analytics or ML stack"
type = "forbidden"
source_modules = ["vektra_assess.llm"]
forbidden_modules = ["vektra_core", "vektra_analytics", "vektra_ingest", "vektra_index", "qdrant_client", "sentence_transformers", "torch"]

# (llm-callers) only the API turn route, the worker (Part B pre-flight) and the vektra_app composition
# roots may import the runner. The source list must equal the assess children minus api, worker and
# llm itself: tests/test_boundaries.py fails when a new child is not listed here.
[[tool.importlinter.contracts]]
name = "only vektra_assess.api and vektra_assess.worker import vektra_assess.llm"
type = "forbidden"
source_modules = ["vektra_assess.context", "vektra_assess.transcript", "vektra_assess.delivery", "vektra_assess.crypto", "vektra_assess.db", "vektra_assess.health", "vektra_assess.config", "vektra_assess.keys", "vektra_assess.errors", "vektra_assess.readable", "vektra_assess.capabilities", "vektra_assess.jobs", "vektra_assess.audit", "vektra_assess.tokens", "vektra_assess.gates", "vektra_assess.turn_markers", "vektra_assess.timing", "vektra_assess.start_rules", "vektra_assess.ui", "vektra_assess.parser_protocol", "vektra_assess.parser_sidecar", "vektra_assess.moodle"]
forbidden_modules = ["vektra_assess.llm"]

# (e) the worker's import ceiling: no ML stack, vector store client or document parser
[[tool.importlinter.contracts]]
name = "vektra_assess must not import the ML, vector store or parsing stacks"
type = "forbidden"
source_modules = ["vektra_assess"]
forbidden_modules = ["sentence_transformers", "torch", "transformers", "qdrant_client", "presidio_analyzer", "presidio_anonymizer", "spacy", "unstructured"]

# (f) the parser sidecar holds nothing but its own packages and the stdlib/parsing libraries:
# it may import vektra_assess.parser_protocol only. The forbidden list must equal the other
# assess children (tests/test_boundaries.py) plus the stacks it must never load.
[[tool.importlinter.contracts]]
name = "vektra_assess.parser_sidecar imports only parser_protocol"
type = "forbidden"
source_modules = ["vektra_assess.parser_sidecar"]
forbidden_modules = ["vektra_assess.api", "vektra_assess.context", "vektra_assess.llm", "vektra_assess.transcript", "vektra_assess.delivery", "vektra_assess.crypto", "vektra_assess.db", "vektra_assess.health", "vektra_assess.config", "vektra_assess.keys", "vektra_assess.errors", "vektra_assess.readable", "vektra_assess.capabilities", "vektra_assess.jobs", "vektra_assess.audit", "vektra_assess.tokens", "vektra_assess.gates", "vektra_assess.turn_markers", "vektra_assess.timing", "vektra_assess.start_rules", "vektra_assess.ui", "vektra_assess.worker", "vektra_assess.moodle", "vektra_shared", "vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_analytics", "vektra_learn", "vektra_app", "sqlalchemy", "asyncpg", "httpx", "litellm", "pydantic", "pydantic_settings", "structlog", "fastapi"]

# (h) the API never reaches the worker (plan assess-job-loop): the worker holds the KEK, the Moodle
# tokens and the SMTP account, and the API process must not be able to import any of that code. The
# outbox helper `vektra_assess.jobs` is the API-safe seam and is not under `worker`.
[[tool.importlinter.contracts]]
name = "vektra_assess.api and vektra_app.main must not import vektra_assess.worker"
type = "forbidden"
source_modules = ["vektra_assess.api", "vektra_app.main"]
forbidden_modules = ["vektra_assess.worker"]

# (g) the API entry never reaches the parser entry: parsing happens in the sidecar only
[[tool.importlinter.contracts]]
name = "vektra_app.main must not import the parser entry"
type = "forbidden"
source_modules = ["vektra_app.main"]
forbidden_modules = ["vektra_app.assess_parser", "vektra_assess.parser_sidecar"]

# ---------------------------------------------------------------------------
# pytest coverage (workspace-level config; each component overrides testpaths)
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# importlib mode required when running pytest from the workspace root
# (avoids ModuleNotFoundError for packages in src/ layout with uv workspaces)
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
markers = [
    "integration: integration tests requiring Docker (excluded from ci-unit)",
    "moodle: live contract tests against the seeded Moodle 4.3 / 5.2 dev envs (assess WS readers)",
]

[tool.coverage.run]
source = [
    "vektra_shared",
    "vektra_admin",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_app",
    "vektra_analytics",
    "vektra_learn",
    "vektra_assess",
]
omit = [
    "tests/*",
    "*/migrations/*",
    # Integration-only modules: covered by Docker Compose integration tests,
    # excluded from unit test coverage to avoid brittle mocking of FastAPI
    # handlers with inline provider instantiation and Alembic internals.
    "*/vektra_shared/startup.py",
    "*/vektra_index/api.py",
    "*/vektra_ingest/api.py",
    "*/vektra_admin/api.py",
    "*/vektra_admin/keystore.py",
    "*/vektra_admin/middleware.py",
    "*/vektra_learn/api.py",
    # vektra_assess data layer: exercised only against a real Postgres (testcontainers,
    # vektra-assess/tests/integration), where the privileges, triggers and row counts
    # they depend on actually exist.
    "*/vektra_assess/db/models.py",
    "*/vektra_assess/crypto/shred.py",
    "*/vektra_assess/crypto/rotation.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
