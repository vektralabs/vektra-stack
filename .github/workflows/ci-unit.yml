name: Unit tests

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # Detect which components have changed to skip unaffected test jobs.
  # Changes to vektra-shared trigger all components (it is a shared dependency).
  detect-changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter reads PR files on pull_request events
    outputs:
      shared:    ${{ steps.filter.outputs.shared }}
      core:      ${{ steps.filter.outputs.core }}
      ingest:    ${{ steps.filter.outputs.ingest }}
      index:     ${{ steps.filter.outputs.index }}
      admin:     ${{ steps.filter.outputs.admin }}
      analytics: ${{ steps.filter.outputs.analytics }}
      learn:     ${{ steps.filter.outputs.learn }}
      assess:    ${{ steps.filter.outputs.assess }}
      assess-ui: ${{ steps.filter.outputs.assess-ui }}
      app:       ${{ steps.filter.outputs.app }}
      lms-provider: ${{ steps.filter.outputs.lms-provider }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'vektra-shared/**'
              - 'testkit/**'
              - 'docker/lms-providers/**'
              - 'Dockerfile'
            core:
              - 'vektra-core/**'
              - 'vektra-shared/**'
            ingest:
              - 'vektra-ingest/**'
              - 'vektra-shared/**'
            index:
              - 'vektra-index/**'
              - 'vektra-shared/**'
            admin:
              - 'vektra-admin/**'
              - 'vektra-shared/**'
            analytics:
              - 'vektra-analytics/**'
              - 'vektra-shared/**'
            learn:
              - 'vektra-learn/**'
              - 'vektra-shared/**'
            assess:
              - 'vektra-assess/**'
              - 'vektra-shared/**'
              - 'testkit/**'
              - 'docker/lms-providers/**'
              - 'Dockerfile'
            assess-ui:
              - 'vektra-assess/ui/**'
            app:
              - 'vektra-app/**'
              - 'vektra-*/**'
              - 'testkit/**'
            # what the LMS provider's suites depend on (see test-lms-provider)
            lms-provider:
              - 'vektra-shared/**'
              - 'vektra-assess/**'
              - 'vektra-app/**'
              - 'testkit/**'
              - 'docker/lms-providers/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci-unit.yml'

  test-shared:
    name: Test vektra-shared
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-shared
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-shared/tests/ -v --tb=short -m "not integration"
          --cov=vektra_shared --cov-report=term-missing --cov-fail-under=80

  test-core:
    name: Test vektra-core
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-core
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-core/tests/ -v --tb=short -m "not integration"
          --cov=vektra_core --cov-report=term-missing --cov-fail-under=80

  test-ingest:
    name: Test vektra-ingest
    needs: detect-changes
    if: needs.detect-changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-ingest
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-ingest/tests/ -v --tb=short -m "not integration"
          --cov=vektra_ingest --cov-report=term-missing --cov-fail-under=80

  test-index:
    name: Test vektra-index
    needs: detect-changes
    if: needs.detect-changes.outputs.index == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-index
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-index/tests/ -v --tb=short -m "not integration"
          --cov=vektra_index --cov-report=term-missing --cov-fail-under=80

  test-admin:
    name: Test vektra-admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-admin
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-admin/tests/ -v --tb=short -m "not integration"
          --cov=vektra_admin --cov-report=term-missing --cov-fail-under=75

  test-analytics:
    name: Test vektra-analytics
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-analytics
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-analytics/tests/ -v --tb=short -m "not integration"
          --cov=vektra_analytics --cov-report=term-missing --cov-fail-under=80

  test-learn:
    name: Test vektra-learn
    needs: detect-changes
    if: needs.detect-changes.outputs.learn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-learn
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-learn/tests/ -v --tb=short -m "not integration"
          --cov=vektra_learn --cov-report=term-missing --cov-fail-under=80

  # The learn widget's own tests (node --test, no dependencies): the token refresh on
  # 401 that the 0.8 aud/iss binding relies on (plan assess-foundations task 3.4).
  test-learn-widget:
    name: Test vektra-learn widget
    needs: detect-changes
    if: needs.detect-changes.outputs.learn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run widget tests
        working-directory: vektra-learn/widget
        run: npm test

  # The assess discussion UI bundle (plan 9): the no-HTML-sink rule, the type check, the
  # build (hashed assets + manifest) and the vitest suite (SSE parser fuzz, postMessage bridge,
  # state machine, views).
  test-assess-ui:
    name: Test vektra-assess UI
    needs: detect-changes
    if: needs.detect-changes.outputs.assess-ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install, lint, type check, build and test
        working-directory: vektra-assess/ui
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npm run build
          npm test

  test-assess:
    name: Test vektra-assess
    needs: detect-changes
    if: needs.detect-changes.outputs.assess == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-assess
      # 77, not 80, since 2a-4 (ADR-0033 D6): the Moodle provider (3070 statements, 97.2% covered
      # by unit tests) left vektra_assess (now in vektra-moodle-discuss). On develop at 01dfe327 the package was
      # 80.66% (17217 statements, 3330 missed); the same code without moodle/ was 77.07% (14147,
      # 3244 missed). After 2a-4 it is 77.04% (14128, 3244 missed): not one covered line of the
      # remaining code was lost (the vertical's tests that ran only over the recordings were
      # re-written on neutral values), the drop is the denominator. The missing ~420 lines to
      # 80% are DB-bound handlers covered by the integration suites, not by mocks. The moved code
      # keeps its own gate (95%) in the provider's repository (provider.yml).
      - name: Run unit tests with coverage
        run: >
          uv run pytest vektra-assess/tests/ -v --tb=short -m "not integration"
          --cov=vektra_assess --cov-report=term-missing --cov-fail-under=77
          --junitxml=assess-unit.xml
      # The parser corpus runs real forkserver children under real rlimits, on Linux only: off
      # Linux it skips with a reason. This runner is Linux, so a skip here is a silent loss of
      # the hostile-input proof and fails the job (plan assess-parser, false-pass guard).
      - name: Parser corpus must have run, not skipped
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("assess-unit.xml").getroot()
          cases = [c for c in root.iter("testcase") if "test_parser_corpus" in (c.get("classname") or "")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"parser corpus: {len(cases)} collected, {len(skipped)} skipped")
          if len(cases) < 55 or skipped:
              sys.exit(f"parser corpus did not fully run: skipped={skipped}")
          PY

  # vektra-app wires every component together (provider registration, startup
  # validation). Its tests existed but nothing ran them, in CI or in `make test`,
  # which is how a registration/validation mismatch shipped on develop and stopped
  # the stack from booting with sparse embeddings enabled (BUG-024).
  test-app:
    name: Test vektra-app
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs PR-authored test code; don't leave the token in .git/config
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen
      - name: Run unit tests
        run: uv run pytest vektra-app/tests/ -v --tb=short -m "not integration"

  # The structural guards, and the only job here that no path filter can skip. That is
  # the whole point of it. Every other job is gated on dorny/paths-filter, so a PR that
  # only edits the Makefile, only edits a workflow, or adds a brand-new vektra-foo/
  # package matches no filter and skips them all — and those are exactly the three
  # changes a guard over the runner lists exists to catch. A guard a path filter can
  # skip is not a guard (DEBT-031), which also applies to the DEBT-029 guard that until
  # now ran only when vektra-shared itself changed.
  #
  # It parses the Makefile and the workflows; it runs no suite and needs no services.
  # The LMS boundary guard belongs here for the same reason: the change it exists to
  # catch is one file in a platform package naming an LMS product, which may match no
  # other filter.
  test-structure:
    name: Structural guards (suite execution, env isolation, image boundary, LMS boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs PR-authored test code; don't leave the token in .git/config
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --dev --frozen --package vektra-shared
      - name: Check suite execution, env isolation, the image content boundary and the LMS boundary
        run: >
          uv run pytest
          vektra-shared/tests/test_suite_execution_coverage.py
          vektra-shared/tests/test_env_isolation_coverage.py
          vektra-shared/tests/test_image_content_boundary.py
          vektra-shared/tests/test_lms_boundary.py
          -v --tb=short

  # The released Moodle LMS provider against THIS PR's platform (ADR-0033 D6, phase 2b). The
  # provider lives in vektra-moodle-discuss and its own CI tests it against a pinned vektra-stack
  # commit, so without this job a platform change that breaks the provider (vektra_shared.lms, the
  # vertical's harness its joint suites import, the conformance kit in testkit) would surface only
  # when that pin is next bumped. It installs this PR's workspace plus the pinned wheel (the same
  # bytes the lms-moodle image installs, hash-checked the same way), checks out the provider's
  # tests at the release tag of that wheel (read from the pin file, never written twice), and runs
  # them with VEKTRA_STACK_ROOT at this checkout: unit, conformance kit on the 4.3 and 5.2
  # recordings, canary matrix and the joint suites on real Postgres. The live suites (-m moodle)
  # need the dev Moodle sites and are deselected; provider-live.yml runs them weekly there.
  #
  # This is also the real check of the wheel's requirements: it declares `vektra-shared` with no
  # version bound, so the image stage's `uv pip check` passes against ANY vektra-shared; only
  # running the provider on this platform shows the two still fit.
  #
  # Skip-safe (DEBT-031): the job always runs and is in the CI gate; it skips its work, saying
  # so, only when nothing it depends on changed (the lms-provider filter above), and always runs
  # it on a push to develop or main.
  test-lms-provider:
    name: The released Moodle LMS provider against this platform
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEVANT: ${{ github.event_name == 'push' || needs.detect-changes.outputs.lms-provider == 'true' }}
    steps:
      - name: Skipped (nothing the provider depends on changed)
        if: env.RELEVANT != 'true'
        run: echo "no change under the lms-provider filter; the provider's suites are not re-run"
      - uses: actions/checkout@v7
        if: env.RELEVANT == 'true'
        with:
          # Runs PR-authored test code; don't leave the token in .git/config
          persist-credentials: false
      - name: Read the provider release from the pin
        if: env.RELEVANT == 'true'
        id: pin
        run: |
          echo "tag=$(python3 vektra-shared/tests/lms_pins.py tag moodle)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 vektra-shared/tests/lms_pins.py version moodle)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: env.RELEVANT == 'true'
        with:
          repository: vektralabs/vektra-moodle-discuss
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          path: _lms-provider
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        if: env.RELEVANT == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # the pinned wheel, as the image installs it (hash-checked, no resolution): the suites run
      # on the released bytes, not on a rebuild of the tag's source
      - name: Install this workspace and the pinned provider wheel
        if: env.RELEVANT == 'true'
        run: |
          uv sync --dev --frozen
          uv pip install --no-config --python .venv/bin/python --no-index --no-cache \
            --require-hashes --no-deps -r docker/lms-providers/moodle.txt
          .venv/bin/python -c "import importlib.metadata as m, sys; v = m.version('vektra-lms-moodle'); print('vektra-lms-moodle', v); sys.exit(v != '${{ steps.pin.outputs.version }}')"
      - name: The provider's suites, on this platform
        if: env.RELEVANT == 'true'
        working-directory: _lms-provider
        env:
          VEKTRA_STACK_ROOT: ${{ github.workspace }}
          # the joint suites' fixtures run `uv run alembic`: never sync the provider away mid-run
          UV_NO_SYNC: "1"
        run: >
          "$VEKTRA_STACK_ROOT/.venv/bin/python" -m pytest provider/tests -m "not moodle"
          -v -rs --tb=short -p no:cacheprovider --junitxml="$GITHUB_WORKSPACE/lms-provider.xml"
      # A green job is not evidence on its own: the conformance kit ran on both recorded releases,
      # and the joint suites on real Postgres ran, not skipped.
      - name: The conformance kit and the joint suites must have run
        if: env.RELEVANT == 'true'
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("lms-provider.xml").getroot().iter("testcase"))
          problems = []
          for fragment, minimum in (
              ("TestMoodle43Conformance", 5),
              ("TestMoodle52Conformance", 5),
              ("integration_moodle.", 8),
              ("integration_moodle.test_setup_check_run", 5),
              ("integration_moodle.test_idor_moodle", 2),
              ("integration_moodle.test_snapshot_canary_db", 1),
              ("test_canary_matrix", 2),
          ):
              hit = [c for c in cases if fragment in (c.get("classname") or "")]
              skipped = [c.get("name") for c in hit if c.find("skipped") is not None]
              print(f"{fragment}: {len(hit)} collected, {len(skipped)} skipped")
              if len(hit) < minimum or skipped:
                  problems.append(f"{fragment}: {len(hit)} collected, skipped={skipped}")
          if problems:
              sys.exit("; ".join(problems))
          PY

  # Aggregator job used as the single required status check in branch protection.
  # Passes if no upstream job failed (skipped jobs are treated as passing).
  ci-gate:
    name: CI gate
    needs: [detect-changes, test-shared, test-core, test-ingest, test-index, test-admin, test-analytics, test-learn, test-learn-widget, test-assess-ui, test-assess, test-app, test-structure, test-lms-provider]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all tests passed or were skipped
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more test jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All tests passed or were skipped (no relevant changes detected)."
