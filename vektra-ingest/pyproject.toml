[project]
name = "vektra-ingest"
version = "0.1.0"
description = "Document processing pipeline for the Vektra platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

[tool.uv.sources]
vektra-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
]
