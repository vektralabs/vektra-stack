[project]
name = "vektra-ingest"
version = "0.3.0"
description = "Document processing pipeline for the Vektra platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "structlog>=24.0",
    "python-magic>=0.4",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "tiktoken>=0.7",
    "arq>=0.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["unstructured[pdf]>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
markers = ["integration: integration tests requiring Docker (excluded from ci-unit)"]

[tool.uv.sources]
vektra-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
    "anyio>=4.0",
]
