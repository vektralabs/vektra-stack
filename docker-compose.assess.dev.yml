# Development and CI only. NOT part of a deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.assess.yml \
#     -f docker-compose.assess.dev.yml --profile assess up -d
#
# Most job handlers of the assess feature arrive with later plans, and the shipped overlay
# (docker-compose.assess.yml) is deliberately fail-closed: a worker with an unbound handler refuses
# to start. This file lets the stack run meanwhile: the unbound kinds stay unbound and a job of such
# a kind fails with handler_not_bound (and one audit event), never completing silently.
#
# It is honoured only with VEKTRA_ENV=development, which this file sets explicitly instead of relying
# on the default; with any other VEKTRA_ENV the worker refuses to start. Drop this file from the CI
# job and from local stacks once every handler is bound.
services:
  vektra-assess-worker:
    environment:
      VEKTRA_ENV: development
      VEKTRA_ASSESS_WORKER_ALLOW_UNBOUND: "true"
  # The discussion runner (plan assess-llm-runner): the API refuses to start without a model or with
  # a safeguard that fell open. Dev and CI images carry no Presidio and no model: an explicit
  # passthrough and a placeholder model let the stack start (no turn is served in CI).
  vektra:
    environment:
      VEKTRA_ENV: development
      VEKTRA_ASSESS_LLM_MODEL: ${VEKTRA_ASSESS_LLM_MODEL:-ollama/dev-placeholder}
      VEKTRA_ASSESS_SAFEGUARD_MODE: none
