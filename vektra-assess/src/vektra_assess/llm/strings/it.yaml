# Vektra-shipped Italian strings of the discussion (REQ-098, BR-009). Moodle strings never override
# them. Final wording is by UX and is validated in the moderated student pilot. Any change here
# changes prompt_version and requires a new NFR-023 activation.
br009: "Voto registrato: {grade} (letto il {date}). Il voto NON è stato modificato da questa discussione; decide l'orale"
classes:
  R-SOL:
    core: "Non posso risolvere, verificare o confrontare le opzioni di questa domanda."
    alternative: "Puoi discuterne con il docente all'orale."
  R-OTHER:
    core: "Posso parlare solo dei dati di questa prova."
    alternative: "Per altre informazioni rivolgiti al docente."
  R-OFFTOPIC:
    core: "Questa discussione riguarda solo la tua prova."
    alternative: "Per altre domande puoi rivolgerti al tutor del corso o al docente."
  R-INJECT:
    core: "Posso solo aiutarti a capire la valutazione di questa prova."
    alternative: "Dimmi quale elemento vuoi discutere."
  R-GHOST:
    core: "Non posso scrivere al posto tuo un testo da consegnare."
    alternative: "Possiamo invece preparare insieme i punti da rivedere."
  R-GRADE:
    core: "Non posso fare previsioni o stime sul voto o sull'orale."
    alternative: "Posso aiutarti a preparare i punti da discutere all'orale."
  W-DISTRESS:
    core: "Mi dispiace che tu ti senta così: è normale che una valutazione pesi."
    alternative: "{support_text}"
missing:
  value_unverified: "[valore non verificato: vedi la pagina di revisione]"
  quote_unverified: "[commento del docente non verificato: vedi la pagina di revisione]"
  replaced_by_system: "[risposta sostituita dal sistema]"
unsupported_language: "Rispondo in italiano: questa discussione supporta solo italiano e inglese."
default_support_text: "Se ne hai bisogno, rivolgiti al docente."
# REQ-099 (b) / REQ-077: the D3 disclosure of the solution-oracle limitation, shown in the
# teacher help text by plan 11 (read through shipped.get(lang).oracle_disclosure)
oracle_disclosure: "Con questa opzione disattivata l'assistente non riceve la soluzione e non deve fornirla, ma per domande risolvibili autonomamente non è possibile garantirlo al 100%: evita di abilitare la discussione su domande che riutilizzerai. Ricorda inoltre che lo studente riceve una copia della trascrizione."
