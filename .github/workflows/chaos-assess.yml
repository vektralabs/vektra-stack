name: Assess chaos (nightly and release tags)

# The assess chaos suite outside the pull-request flow (plan assess-hardening-release): every
# night on develop, and on every release tag. The acceptance criterion is "0 invariant violations
# on two consecutive nightly runs and on the release tag"; the invariant report of each run is the
# evidence, kept as an artifact. Pull requests run the same target in integration.yml.

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-assess:
    name: Assess chaos and invariant gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run the chaos harness and the invariant gate
        run: |
          mkdir -p test-results/assess-chaos
          CHAOS_REPORT_DIR=test-results/assess-chaos uv run pytest tests/chaos/assess vektra-assess/tests/integration/test_chaos_*.py -v --tb=short --junitxml=test-results/assess-chaos/junit.xml || status=$?
          uv run python tests/chaos/assess/gate.py test-results/assess-chaos/junit.xml test-results/assess-chaos 61 26
          exit "${status:-0}"

      - name: Upload the invariant report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-chaos-report-${{ github.run_id }}
          path: test-results/assess-chaos/
          retention-days: 90
