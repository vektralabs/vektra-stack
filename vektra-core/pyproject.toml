[project]
name = "vektra-core"
version = "0.6.0"
description = "RAG engine, LLM abstraction, and conversation management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
    "fastapi>=0.115",
    "pydantic>=2,<3",
    "litellm>=1.83.10",
    "jinja2>=3.1",
    "structlog>=24.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "rerankers[flashrank]>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

[tool.uv.sources]
vektra-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
]
