[tool.uv.workspace]
members = ["vektra-shared", "vektra-core", "vektra-ingest", "vektra-index", "vektra-admin", "vektra-analytics", "vektra-learn", "vektra-app"]

# PyTorch CPU-only index for CI and development (no NVIDIA CUDA packages).
# Only used by packages with an explicit source override (explicit = true).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "pyyaml>=6.0.3",
    "testcontainers[postgres]>=4.14.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "mypy>=1.20.2",
    "import-linter>=2.11",
]

# ---------------------------------------------------------------------------
# Ruff: linter and formatter (replaces flake8, isort, black)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernize syntax)
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length enforced by formatter, not linter
    "B008",   # FastAPI requires Depends()/Security() in function signature defaults
    "B904",   # raise-without-from-inside-except: pre-existing pattern, intentional for HTTP errors
    "B905",   # zip-without-explicit-strict: pre-existing pattern
    "UP042",  # StrEnum migration deferred (may affect serialization behavior)
    "RUF012", # ClassVar annotation not required for arq/pytest class-level config attrs
]

[tool.ruff.lint.isort]
known-first-party = [
    "vektra_shared",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_admin",
    "vektra_app",
    "vektra_analytics",
    "vektra_learn",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: type checking with SQLAlchemy 2.0 plugin
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Third-party libraries without complete stubs
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "pdfplumber.*",
    "magic.*",
    "sentence_transformers.*",
    "pgvector.*",
    "arq.*",
    "pptx.*",
    "docx.*",
    "testcontainers.*",
    "psutil.*",
    "starlette_prometheus.*",
    "uvicorn.*",
    "qdrant_client",
    "qdrant_client.*",
    "fastembed",
    "fastembed.*",
    "unstructured",
    "unstructured.*",
    "cachetools",
    "cachetools.*",
]
ignore_missing_imports = true

# Tests: relax strictness (no type annotations required)
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# import-linter: module boundary enforcement (replaces .importlinter)
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "vektra_shared",
    "vektra_admin",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_analytics",
    "vektra_app",
    "vektra_learn",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "vektra_shared must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_shared"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_analytics", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_admin must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_admin"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_core must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_core"]
forbidden_modules = ["vektra_admin", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_ingest must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_ingest"]
forbidden_modules = ["vektra_admin", "vektra_core", "vektra_index", "vektra_analytics", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_index must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_index"]
forbidden_modules = ["vektra_admin", "vektra_core", "vektra_ingest", "vektra_analytics", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_analytics must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_analytics"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_learn"]

[[tool.importlinter.contracts]]
name = "vektra_learn must not import from other vektra components"
type = "forbidden"
source_modules = ["vektra_learn"]
forbidden_modules = ["vektra_core", "vektra_ingest", "vektra_index", "vektra_admin", "vektra_analytics", "vektra_app"]

[[tool.importlinter.contracts]]
name = "No component shall import the app entrypoint"
type = "forbidden"
source_modules = ["vektra_shared", "vektra_admin", "vektra_core", "vektra_ingest", "vektra_index", "vektra_analytics", "vektra_learn"]
forbidden_modules = ["vektra_app"]

# ---------------------------------------------------------------------------
# pytest coverage (workspace-level config; each component overrides testpaths)
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# importlib mode required when running pytest from the workspace root
# (avoids ModuleNotFoundError for packages in src/ layout with uv workspaces)
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
markers = ["integration: integration tests requiring Docker (excluded from ci-unit)"]

[tool.coverage.run]
source = [
    "vektra_shared",
    "vektra_admin",
    "vektra_core",
    "vektra_ingest",
    "vektra_index",
    "vektra_app",
    "vektra_analytics",
    "vektra_learn",
]
omit = [
    "tests/*",
    "*/migrations/*",
    # Integration-only modules: covered by Docker Compose integration tests,
    # excluded from unit test coverage to avoid brittle mocking of FastAPI
    # handlers with inline provider instantiation and Alembic internals.
    "*/vektra_shared/startup.py",
    "*/vektra_index/api.py",
    "*/vektra_ingest/api.py",
    "*/vektra_admin/api.py",
    "*/vektra_admin/keystore.py",
    "*/vektra_admin/middleware.py",
    "*/vektra_learn/api.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
