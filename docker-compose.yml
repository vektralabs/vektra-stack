# ==========================================================================
# Vektra RAG platform - Docker Compose stack
# ADR-0004 (three-service stack), ADR-0012
#
# Usage:
#   docker compose up -d                        # core stack
#   docker compose --profile local-llm up -d    # + Ollama for local LLM
#   docker compose --profile qdrant up -d       # + Qdrant (Phase 2)
#   docker compose --profile tei up -d          # + TEI embeddings (Phase 2)
# ==========================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL with pgvector extension (pre-compiled in image)
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vektra
      POSTGRES_USER: vektra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektra}
    volumes:
      - vektra_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vektra -d vektra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Vektra API server (FastAPI + uvicorn)
  # Background ingestion runs in-process via BackgroundTasks (ADR-0006).
  # Phase 2: add redis + vektra-worker for separate arq worker scaling.
  # --------------------------------------------------------------------------
  vektra:
    build: .
    image: vektra-stack
    environment:
      CMD_TARGET: server
      VEKTRA_DATABASE_URL: postgresql+asyncpg://vektra:${POSTGRES_PASSWORD:-vektra}@postgres:5432/vektra
    env_file:
      - path: .env
        required: false
    ports:
      - "${VEKTRA_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G

  # --------------------------------------------------------------------------
  # Ollama - local LLM inference (optional, activated via profile)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.17.0
    profiles:
      - local-llm
    volumes:
      - vektra_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  # --------------------------------------------------------------------------
  # Qdrant - Phase 2 vector store alternative (optional, activated via profile)
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17.0
    profiles:
      - qdrant
    volumes:
      - vektra_qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # TEI - Hugging Face Text Embeddings Inference (optional, activated via profile)
  # --------------------------------------------------------------------------
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    profiles:
      - tei
    command: --model-id sentence-transformers/all-MiniLM-L6-v2 --port 8080
    volumes:
      - vektra_tei_cache:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  vektra_pgdata:
  vektra_ollama:
  vektra_qdrant:
  vektra_tei_cache:
