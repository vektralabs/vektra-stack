name: Integration tests

# Requires infra-docker (Wave 5) to be complete.
# Until then this workflow only defines the structure and triggers.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  integration:
    name: Integration tests + NFR gates
    # TODO (Wave 5): replace ubuntu-latest with self-hosted VPS runner once
    # the runner is configured. See CONTRIBUTING.md for setup instructions.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

