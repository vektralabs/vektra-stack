# The 40-Start assess burst (NFR-018 / NFR-020). It was the second job of assess-moodle-contract.yml;
# that workflow's live contract run of the Moodle LMS provider moved with the provider to its own
# repository (vektra-moodle-discuss, provider-live.yml, ADR-0033 phase 2b), while the burst is the
# platform's own NFR and stays here, unchanged. Manual and weekly: never part of the PR gate.
name: assess-burst

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  # The 40-Start burst (plan assess-session-lifecycle M1.11 / M5.12, NFR-018 / NFR-020): manual and
  # weekly, never in the PR gate. It runs only against a target the operator configured (repository
  # variables and secrets below); without one it writes a BLOCKED result and pytest reports SKIPPED,
  # which this job prints explicitly. It never runs against a production Moodle or a cloud model.
  assess-burst:
    name: Assess burst (40 Starts; BLOCKED without a configured target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VEKTRA_ASSESS_BURST_API: ${{ vars.VEKTRA_ASSESS_BURST_API }}
      VEKTRA_ASSESS_BURST_MOODLE: ${{ vars.VEKTRA_ASSESS_BURST_MOODLE }}
      VEKTRA_ASSESS_BURST_MODEL: ${{ vars.VEKTRA_ASSESS_BURST_MODEL }}
      VEKTRA_ASSESS_BURST_MANIFEST: ${{ vars.VEKTRA_ASSESS_BURST_MANIFEST }}
      VEKTRA_ASSESS_BURST_MINT_KEY: ${{ secrets.VEKTRA_ASSESS_BURST_MINT_KEY }}
      VEKTRA_ASSESS_BURST_DSN: ${{ secrets.VEKTRA_ASSESS_BURST_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the repository carries committed results (BLOCKED runs): drop them, so the summary and
      # the artifact can only show what THIS run wrote (a run that fails early writes nothing)
      - name: Clear historical burst results
        run: rm -f tests/nfr/results/assess-burst-*.json

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run the burst
        run: uv run pytest tests/nfr/test_assess_burst.py -v -rs --tb=short

      - name: Report the result status (PASS / FAIL / BLOCKED)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          files = sorted(pathlib.Path("tests/nfr/results").glob("assess-burst-*.json"))
          if not files:
              raise SystemExit("no burst result was written")
          result = json.loads(files[-1].read_text())
          line = f"assess burst: {result['status']} ({files[-1].name})"
          for blocker in result.get("blockers", []):
              line += f"\n- {blocker}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(line + "\n")
          PY

      - name: Upload the burst result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-burst-result
          path: tests/nfr/results/
          retention-days: 30
