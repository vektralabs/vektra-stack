name: Shell scripts

# Validates shell scripts in scripts/ directory.
# Steps are guarded by a check for scripts/*.sh existence, so this workflow
# is a no-op until infra-makefile (Wave 6) creates the scripts.

on:
  pull_request:

permissions:
  contents: read

jobs:
  shell-scripts:
    name: Validate shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check shell scripts exist
        id: check
        run: |
          if [ -d scripts ] && [ -n "$(ls scripts/*.sh 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No shell scripts found in scripts/ -- skipping validation."
          fi

      - name: Lint with shellcheck
        if: steps.check.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Test scripts with --dry-run (valid input)
        if: steps.check.outputs.found == 'true'
        run: |
          failed=0
          for script in scripts/*.sh; do
            echo "--- Testing $script --dry-run ---"
            if bash "$script" --dry-run; then
              echo "PASS: $script"
            else
              echo "FAIL: $script exited with $?"
              failed=1
            fi
          done
          exit $failed

      - name: Test scripts reject invalid input
        if: steps.check.outputs.found == 'true'
        run: |
          failed=0
          for script in scripts/*.sh; do
            echo "--- Testing $script with invalid input ---"
            if bash "$script" --invalid-flag-that-should-fail 2>/dev/null; then
              echo "FAIL: $script accepted invalid input (should have exited non-zero)"
              failed=1
            else
              echo "PASS: $script rejected invalid input (exit $?)"
            fi
          done
          exit $failed
