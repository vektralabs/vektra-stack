[project]
name = "vektra-core"
version = "0.1.0"
description = "RAG engine, LLM abstraction, and conversation management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_core"]

[tool.uv.sources]
vektra-shared = { workspace = true }
