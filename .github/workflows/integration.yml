name: Integration tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  integration:
    # The suite runs against every supported vector store, not just the default.
    # BUG-023 survived for months because it ran against pgvector only: with
    # Qdrant active, endpoints that read chunks from Postgres worked on an empty
    # table and reported success. A provider-specific regression fails here now.
    name: Integration tests (${{ matrix.vector_store }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        vector_store: [pgvector, qdrant]

    # Every compose call of this job, the tests' own included, also loads the CI
    # Hugging Face cache overlay (.github/ci/compose.hf-cache.yml): NFR-004 below must
    # measure our startup, not a model download from the Hub. The cache lives outside
    # the checkout (not in the image build context) at an absolute path: actions/cache
    # refuses a path with "..".
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:.github/ci/compose.hf-cache.yml
      HF_CACHE_DIR: /home/runner/hf-cache

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      # Keyed on the lock file (library versions) and on the config that names the
      # default models. Offline only on an exact hit: a cold run downloads, then saves.
      - name: Restore the Hugging Face model cache
        id: hf-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HF_CACHE_DIR }}
          key: hf-compose-${{ runner.os }}-${{ hashFiles('uv.lock', 'vektra-shared/src/vektra_shared/config.py') }}

      - name: Prepare the Hugging Face model cache
        run: |
          mkdir -p "$HF_CACHE_DIR"
          # the API container runs as uid 1000, the runner as 1001
          chmod -R a+rwX "$HF_CACHE_DIR"
          if [ "${{ steps.hf-cache.outputs.cache-hit }}" = "true" ]; then
            echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          fi

      - name: Prepare test results directory
        run: mkdir -p test-results

      - name: Create CI environment file
        run: |
          {
            echo 'VEKTRA_LLM_PROVIDER=ollama/llama3'
            echo 'VEKTRA_STARTUP_LLM_CHECK=false'
            echo 'VEKTRA_LLM_CONTEXT_ONLY_ENABLED=true'
            echo 'VEKTRA_ADMIN_BOOTSTRAP_KEY=ci-bootstrap-key'
            echo "VEKTRA_VECTOR_STORE_PROVIDER=${{ matrix.vector_store }}"
          } > .env
          if [ "${{ matrix.vector_store }}" = "qdrant" ]; then
            echo 'VEKTRA_QDRANT_URL=http://qdrant:6333' >> .env
          fi

      - name: Build Docker image
        run: docker compose build

      # The production VM's CPU predates x86-64-v2, and a wheel built for a newer
      # baseline does not degrade there: it aborts the interpreter at import
      # (BUG-027). Every GitHub runner supports far more than that host, so no
      # native test on this machine can see the failure. qemu-user masks CPUID to
      # the model given by -cpu, which is enough to reproduce it exactly.
      #
      # This runs once, on the pgvector leg: it is a property of the image, not of
      # the vector store.
      - name: Image imports on a pre-x86-64-v2 CPU (BUG-027)
        if: matrix.vector_store == 'pgvector'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          # Ubuntu 26.04 (QEMU 10) dropped qemu-user-static: qemu-user ships
          # the static binary itself, without the -static suffix. Older images
          # still have the separate package, whose qemu-user is dynamic.
          if apt-cache policy qemu-user-static | grep -q 'Candidate: [0-9]'; then
            sudo apt-get install -y -qq qemu-user-static
            QEMU=/usr/bin/qemu-x86_64-static
          else
            sudo apt-get install -y -qq qemu-user
            QEMU=/usr/bin/qemu-x86_64
          fi
          # The binary is mounted into the image, so it must not depend on the
          # host's libc.
          file -L "$QEMU" | grep -q 'static' || { echo "$QEMU is not statically linked"; exit 1; }

          # Control first. qemu-user masks CPUID but leaves /proc/cpuinfo showing
          # the host's flags, so an emulation that silently failed to mask would
          # make the check below pass on any CPU — the same shape as a build-context
          # test that passes because the context is empty. Assert the emulated CPU
          # really lacks the features before trusting anything it says.
          #
          # --init on both runs: without it qemu is PID 1, and the SIGILL it raises
          # on itself to die is ignored there, so a failing check hangs until the
          # step timeout instead of exiting 132.
          docker run --rm --init \
            -v "$QEMU:/usr/bin/qemu-x86_64-static:ro" \
            --entrypoint /usr/bin/qemu-x86_64-static \
            vektra-stack -cpu qemu64,+sse3 /app/.venv/bin/python -c '
          import numpy
          try:
              from numpy._core._multiarray_umath import __cpu_features__ as feats
          except ImportError:
              from numpy.core._multiarray_umath import __cpu_features__ as feats
          present = [n for n in ("POPCNT", "SSE41", "SSE42") if feats.get(n)]
          assert not present, f"emulation is not masking {present}; this check would pass anywhere"
          print("control ok: numpy", numpy.__version__, "sees no POPCNT/SSE41/SSE42")
          '

          # The real check: everything the container loads must import on that CPU.
          # A failure here is a genuine signal, not a flake to retry — it is the
          # production stack refusing to boot, reproduced.
          docker run --rm --init \
            -e OMP_NUM_THREADS=1 \
            -v "$QEMU:/usr/bin/qemu-x86_64-static:ro" \
            --entrypoint /usr/bin/qemu-x86_64-static \
            vektra-stack -cpu qemu64,+sse3 /app/.venv/bin/python -c '
          import importlib
          for name in (
              "numpy", "scipy", "sklearn", "onnxruntime", "fastembed",
              "torch", "transformers", "sentence_transformers",
              "qdrant_client", "pgvector",
              # Every workspace package the image installs, not just the two
              # that happen to pull the ML stack: the failure this guards is an
              # import-time CPU fault, and it would land in whichever package
              # first touches a bad wheel.
              "vektra_shared", "vektra_core", "vektra_index", "vektra_ingest",
              "vektra_admin", "vektra_analytics", "vektra_learn", "vektra_app",
              # Assess (ARCH-078): cryptography is a hard dependency with no
              # weaker fallback (ADR-0031 amended), so its native code must load
              # on the production CPU. defusedxml/html5lib/aiosmtplib are pure
              # Python but listed so a future native rewrite is caught here.
              "vektra_assess", "vektra_app.assess_worker", "vektra_app.assess_parser",
              # The job loop (plan assess-job-loop): asyncpg and the asyncio runtime it
              # sits on must import on the production CPU, in the process that runs them.
              "vektra_assess.worker.runtime", "vektra_assess.worker.listener", "asyncpg",
              # The parser sidecar (plan assess-parser): its parsing stack, native or not,
              # must import on the production CPU. pdfminer.six pulls cryptography.
              "vektra_assess.parser_sidecar.server", "pdfminer.high_level",
              "cryptography.hazmat.primitives.ciphers.aead",
              "cryptography.hazmat.primitives.asymmetric.x25519",
              "cryptography.hazmat.primitives.kdf.hkdf",
              "defusedxml.ElementTree", "html5lib", "aiosmtplib",
              # The model context (plan assess-context): snapshot, assembly, Part A (Jinja2) and
              # the worker-only capture must import on the production CPU too.
              "vektra_assess.context.assemble", "vektra_assess.context.part_a",
              "vektra_assess.context.capture.capture", "jinja2",
              # The discussion runner (plan assess-llm-runner): prompts, post-check, shipped
              # strings (PyYAML) and the composition used by the API and by the worker.
              "vektra_assess.llm", "vektra_assess.llm.runner", "vektra_assess.llm.shipped",
              "yaml", "vektra_app.assess_llm",
              # Transcripts (plan assess-transcript-delivery): rendering, the allowlist, the
              # TeX-to-MathML converter (pure Python) and the sealed store, in both processes.
              "vektra_assess.transcript.render", "vektra_assess.transcript.allowlist",
              "vektra_assess.transcript.mathml", "vektra_assess.transcript.store",
              "latex2mathml.converter", "vektra_assess.worker.transcript_gen",
              "vektra_assess.api.transcripts",
              # Delivery (plan transcript-delivery 10b): the SMTP client of the worker
              # (aiosmtplib), the email builder, the backoff, the recipients and the probe.
              # No apostrophes in this block: it sits inside a single-quoted shell string.
              "vektra_assess.delivery.message", "vektra_assess.delivery.smtp",
              "vektra_assess.delivery.backoff", "vektra_assess.delivery.recipients",
              "vektra_assess.delivery.handler", "vektra_assess.delivery.probe",
              "vektra_assess.delivery.notify",
              # Teacher operations (plan teacher-ops 11a): the fresh editor check and the
              # worker job that reads the activity facts it checks against.
              "vektra_assess.api.teachers", "vektra_assess.worker.teacher_gate",
              "vektra_assess.api.teacher_config", "vektra_assess.teacher.validation",
          ):
              importlib.import_module(name)
              print("imported", name, flush=True)
          # The module the container runs. Importing it builds the FastAPI app,
          # which is the closest this check gets to the real startup path
          # without a database behind it.
          import vektra_app.main
          print("imported vektra_app.main", flush=True)

          # Import alone does not run the OpenSSL code paths that would pick
          # instructions this CPU lacks: execute one AES-256-GCM round trip and
          # one X25519 exchange (plus HKDF), as the assess crypto module will.
          import os
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          key, nonce = AESGCM.generate_key(bit_length=256), os.urandom(12)
          ct = AESGCM(key).encrypt(nonce, b"bug-027 probe", b"aad")
          assert AESGCM(key).decrypt(nonce, ct, b"aad") == b"bug-027 probe"
          a, b = X25519PrivateKey.generate(), X25519PrivateKey.generate()
          shared = a.exchange(b.public_key())
          assert shared == b.exchange(a.public_key()) and len(shared) == 32
          okm = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b"probe").derive(shared)
          assert len(okm) == 32
          print("crypto ok: AES-256-GCM round trip, X25519 exchange, HKDF", flush=True)

          # Importing is not running: parse one PDF with the sidecar extractor so
          # pdfminer, the sniffer and the text path execute on this CPU too.
          from vektra_assess.parser_sidecar.child import run
          from vektra_assess.parser_sidecar.ping import ping_pdf
          res = run("parse", ping_pdf(), "pdf", max_pages=5, max_chars=10000)
          assert res.status.value == "READ" and "self-check" in res.text, res
          print("parser ok: pdfminer parsed the embedded page", flush=True)
          '

      # On a miss the mounted cache is empty, and HF_HOME=/hf-cache would hide the
      # embedding model baked into the image: copy the image's cache in first, so
      # the timed start never downloads a model the image already carries.
      - name: Seed the Hugging Face cache from the image
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --user 0 --entrypoint sh -v "$HF_CACHE_DIR:/hf-cache" vektra-stack \
            -c 'cp -R /home/vektra/.cache/huggingface/. /hf-cache/ && chmod -R a+rwX /hf-cache'
          ls "$HF_CACHE_DIR/hub"

      - name: Start stack and measure startup (NFR-004)
        id: startup
        env:
          # The qdrant service sits behind a compose profile
          COMPOSE_PROFILES: ${{ matrix.vector_store == 'qdrant' && 'qdrant' || '' }}
        run: |
          START_NS=$(date +%s%N)
          docker compose up -d
          timeout 90 bash -c '
            until curl -so /dev/null http://localhost:8000/health 2>/dev/null; do
              sleep 2
            done
          '
          END_NS=$(date +%s%N)
          ELAPSED_MS=$(( (END_NS - START_NS) / 1000000 ))
          echo "startup_ms=$ELAPSED_MS" >> "$GITHUB_OUTPUT"
          echo "::notice::Container startup: ${ELAPSED_MS}ms (NFR-004 limit: 60000ms)"

      # test_startup.py (ARCH-057) asserts the 11 startup steps against the logs of the
      # stack this job has just brought up. Its docstring said it ran here; it did not,
      # because this step named tests/integration/ and nothing named tests/ (DEBT-031).
      # It is the same startup surface BUG-024 broke, and it was watching nothing.
      - name: Run integration tests (REQ-032) and startup validation (ARCH-057)
        id: integration
        run: |
          uv run pytest tests/integration/ tests/test_startup.py \
            -v --tb=short \
            --junitxml=test-results/integration-${{ matrix.vector_store }}.xml
        timeout-minutes: 10
        env:
          VEKTRA_API_URL: http://localhost:8000
          VEKTRA_BOOTSTRAP_KEY: ci-bootstrap-key

      # NFR gates seed and count chunks in Postgres directly, so they are bound
      # to pgvector by construction. Running them once is enough: they measure
      # latency and startup, not chunk paths.
      - name: NFR hard gates (NFR-002/004/007/009)
        if: matrix.vector_store == 'pgvector'
        run: |
          uv run pytest tests/nfr/test_nfr_hard.py \
            -v --tb=short --junitxml=test-results/nfr-hard.xml
        env:
          VEKTRA_API_URL: http://localhost:8000
          VEKTRA_BOOTSTRAP_KEY: ci-bootstrap-key
          STARTUP_MS: ${{ steps.startup.outputs.startup_ms }}

      # Query latency measurement removed from CI: requires a live LLM
      # which is not available in GitHub Actions. Run manually on a host with one:
      #   uv run pytest tests/nfr/test_performance.py -v

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        env:
          COMPOSE_PROFILES: ${{ matrix.vector_store == 'qdrant' && 'qdrant' || '' }}
        run: docker compose down -v --remove-orphans

      # Saved after tear-down and whatever the tests did, so a cold run that fails a
      # test still warms the next one. The two matrix legs share the key: the second
      # save finds it taken, which is not an error.
      # Saved only when every model the next (offline) run needs is in the cache:
      # an exact hit with a model missing would fail that run instead of this one.
      - name: Check the Hugging Face cache is complete
        id: hf-complete
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          HF_HOME: ${{ env.HF_CACHE_DIR }}
        run: uv run --frozen python .github/ci/check_hf_cache.py

      - name: Save the Hugging Face model cache
        if: always() && steps.hf-complete.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HF_CACHE_DIR }}
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-${{ matrix.vector_store }}
          path: test-results/
          retention-days: 14

  # Every `integration`-marked test in every package, vektra-app included (its own
  # suite is the ARCH-057 startup sequence and the REQ-011/NFR-009 error contract).
  # DEBT-030 wired up vektra-app by hand and left the identical hole open next door:
  # the integration suites of vektra-admin, vektra-index and vektra-ingest are excluded
  # from every unit run by `-m "not integration"` and were named by no workflow, so they
  # had never been executed once (DEBT-031).
  #
  # The target is a glob deliberately. A hand-written package list is the thing that
  # keeps failing here — twice now — so a package added tomorrow is picked up with no
  # edit to this file. These suites bring up their own postgres via testcontainers, so
  # they need Docker but not the compose stack.
  package-integration:
    name: Package integration tests (all packages)
    runs-on: ubuntu-latest
    # 30 was hit by PR #154: the job already took 28 min on develop, ~21 of them in
    # vektra-admin/tests/test_integration.py (~30 s per test); the assess lifecycle suite
    # adds ~8 min. Speeding up the admin suite is tracked separately.
    timeout-minutes: 60

    # The vektra-app startup test (NFR-004) builds the real providers in process: the
    # embedding model and the default cross-encoder reranker come from this cache, not
    # from the Hub. Its own key: these suites also load models the compose jobs do not.
    env:
      HF_HOME: /home/runner/hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          # Runs PR-authored test code; no reason to keep the token in .git/config
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Restore the Hugging Face model cache
        id: hf-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-packages-${{ runner.os }}-${{ hashFiles('uv.lock', 'vektra-shared/src/vektra_shared/config.py') }}

      - name: Go offline on an exact cache hit
        if: steps.hf-cache.outputs.cache-hit == 'true'
        run: echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Prepare test results directory
        run: mkdir -p test-results

      - name: Run every package's integration tests
        run: |
          uv run pytest vektra-*/tests -m integration \
            -v --tb=short --junitxml=test-results/package-integration.xml

      # Without Docker the assess data tests SKIP (never pass). Here that is a failure:
      # the grant matrix and the access boundary must have actually run (plan
      # assess-data-crypto, Test Infrastructure false-pass guard).
      - name: Assess integration tests must have run, not skipped
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results/package-integration.xml").getroot()
          # the live-Moodle tests (-m moodle) need two Moodle sites and are run by
          # assess-moodle-contract.yml: here they SKIP by design and do not count
          LIVE = (
              "test_moodle_live", "test_moodle_setup_live", "test_context_live",
              "test_idor_live", "test_req073_live",
              # the browser e2e needs Node and Chromium: the assess-ui-e2e job runs it,
              # with VEKTRA_ASSESS_E2E_REQUIRED=1 (a skip there is a failure); the same job
              # runs the transcript browser checks (plan 10: inertness, axe + Nu checker)
              "test_ui_e2e", "test_transcript_inert_browser", "test_transcript_a11y",
          )
          cases = [
              c for c in root.iter("testcase")
              if "vektra-assess.tests" in (c.get("classname") or "")
              and not any(name in (c.get("classname") or "") for name in LIVE)
          ]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"assess integration: {len(cases)} collected, {len(skipped)} skipped")
          if len(cases) < 50 or skipped:
              sys.exit(f"assess integration suite did not fully run: skipped={skipped}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-integration-test-results
          path: test-results/
          retention-days: 14

      # Saved only when every model the next (offline) run needs is in the cache:
      # an exact hit with a model missing would fail that run instead of this one.
      - name: Check the Hugging Face cache is complete
        id: hf-complete
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: uv run --frozen python .github/ci/check_hf_cache.py all-MiniLM-L6-v2

      - name: Save the Hugging Face model cache
        if: always() && steps.hf-complete.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

  # The assess overlay (plan assess-foundations 7.6, 9.4): the full trust-domain
  # topology brought up for real, then probed from inside the containers (parser has
  # no network and no secrets, roles are what Postgres says, worker idle VmRSS from
  # /proc). VEKTRA_ASSESS_STACK=1 turns a missing stack into a failure, not a skip.
  assess-stack:
    name: Assess stack (trust domains, worker RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The API's 120 s readiness wait below covers the model load: the CI Hugging Face
    # overlay serves it from the cache shared with the integration job (same image, same
    # models). The tests' own compose calls touch only the worker and the parser.
    env:
      HF_CACHE_DIR: /home/runner/hf-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Restore the Hugging Face model cache
        id: hf-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HF_CACHE_DIR }}
          key: hf-compose-${{ runner.os }}-${{ hashFiles('uv.lock', 'vektra-shared/src/vektra_shared/config.py') }}

      - name: Prepare the Hugging Face model cache
        run: |
          mkdir -p "$HF_CACHE_DIR"
          chmod -R a+rwX "$HF_CACHE_DIR"
          if [ "${{ steps.hf-cache.outputs.cache-hit }}" = "true" ]; then
            echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"
          fi

      - name: Create CI environment file and generated assess keys
        run: |
          {
            echo 'VEKTRA_LLM_PROVIDER=ollama/llama3'
            echo 'VEKTRA_STARTUP_LLM_CHECK=false'
            echo 'VEKTRA_LLM_CONTEXT_ONLY_ENABLED=true'
            echo 'VEKTRA_ADMIN_BOOTSTRAP_KEY=ci-bootstrap-key'
          } > .env
          make assess-keys
          # The containers run as uid 1000 and the key check refuses a file owned by anyone
          # else. Compose does not remap the owner of a file secret on a Linux engine, so the
          # runner-owned files (uid 1001) must be handed to the container user.
          sudo chown -R 1000:1000 secrets/assess

      - name: Build the image
        run: docker compose build

      # On a miss the mounted cache is empty, and HF_HOME=/hf-cache would hide the
      # embedding model baked into the image: copy the image's cache in first, so
      # the timed start never downloads a model the image already carries.
      - name: Seed the Hugging Face cache from the image
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --user 0 --entrypoint sh -v "$HF_CACHE_DIR:/hf-cache" vektra-stack \
            -c 'cp -R /home/vektra/.cache/huggingface/. /hf-cache/ && chmod -R a+rwX /hf-cache'
          ls "$HF_CACHE_DIR/hub"

      - name: Start the assess stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.assess.yml -f docker-compose.assess.dev.yml -f .github/ci/compose.hf-cache.yml --profile assess up -d
          timeout 120 bash -c 'until curl -so /dev/null http://localhost:8000/health; do sleep 2; done'
          timeout 90 bash -c 'until [ "$(docker compose -f docker-compose.yml -f docker-compose.assess.yml -f docker-compose.assess.dev.yml -f .github/ci/compose.hf-cache.yml --profile assess ps vektra-assess-worker --format "{{.Health}}")" = "healthy" ]; do sleep 3; done'

      - name: Worker import profile (artifact)
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.yml -f docker-compose.assess.yml -f docker-compose.assess.dev.yml -f .github/ci/compose.hf-cache.yml --profile assess \
            exec -T vektra-assess-worker python -X importtime -c \
            "import vektra_app.assess_worker; from vektra_core.providers.litellm_provider import LitellmProvider" \
            2> test-results/assess-worker-importtime.txt || true
          sort -t'|' -k2 -n -r test-results/assess-worker-importtime.txt | head -25 || true

      - name: Run the assess stack tests
        run: |
          uv run pytest tests/assess -v --tb=short --junitxml=test-results/assess-stack.xml
        env:
          VEKTRA_ASSESS_STACK: "1"
          VEKTRA_API_URL: http://localhost:8000
          VEKTRA_BOOTSTRAP_KEY: ci-bootstrap-key

      # The container test of the parser sidecar: with VEKTRA_ASSESS_STACK=1 a missing stack
      # fails it, but a skipped case would still be a hole, so count them.
      - name: Parser container tests must have run, not skipped
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results/assess-stack.xml").getroot()
          cases = [c for c in root.iter("testcase") if "test_parser_container" in (c.get("classname") or "")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"parser container: {len(cases)} collected, {len(skipped)} skipped")
          if len(cases) < 8 or skipped:
              sys.exit(f"parser container tests did not fully run: skipped={skipped}")
          PY

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.assess.yml -f docker-compose.assess.dev.yml -f .github/ci/compose.hf-cache.yml --profile assess logs --tail=200

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-stack-test-results
          path: test-results/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.assess.yml -f docker-compose.assess.dev.yml -f .github/ci/compose.hf-cache.yml --profile assess down -v

      # Saved only when every model the next (offline) run needs is in the cache:
      # an exact hit with a model missing would fail that run instead of this one.
      - name: Check the Hugging Face cache is complete
        id: hf-complete
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          HF_HOME: ${{ env.HF_CACHE_DIR }}
        run: uv run --frozen python .github/ci/check_hf_cache.py

      - name: Save the Hugging Face model cache
        if: always() && steps.hf-complete.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HF_CACHE_DIR }}
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

  # Chaos on the assess worker (plan assess-job-loop): the real worker process against a real
  # Postgres, killed (kill -9), terminated (SIGTERM), cut off (container restart, backend
  # termination, a blackholed half-open link) and left idle (RSS ceiling, read from /proc on
  # Linux). Assertions are row counts: jobs done = N, effects = N, no expired lease, no dead job.
  assess-chaos:
    name: Assess chaos (kill, restart, half-open, refusals, idle RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      # The suite, then the gate (tests/chaos/assess/gate.py, the same as `make test-chaos-assess`):
      # a skipped case, fewer cases or invariant reports than declared, or any violation fails.
      - name: Run the chaos harness and the invariant gate
        run: |
          mkdir -p test-results/assess-chaos
          CHAOS_REPORT_DIR=test-results/assess-chaos uv run pytest tests/chaos/assess -v --tb=short --junitxml=test-results/assess-chaos/junit.xml || status=$?
          uv run python tests/chaos/assess/gate.py test-results/assess-chaos/junit.xml test-results/assess-chaos 41 12
          exit "${status:-0}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-chaos-test-results
          path: test-results/assess-chaos/
          retention-days: 14

  # The discussion UI in a real browser (plan 9): Playwright + axe against the production
  # assess and UI routers over a migrated Postgres (testcontainers), framed by a Moodle stub
  # on a second origin, with a fake model. Specs: vektra-assess/ui/e2e/; harness:
  # vektra-assess/tests/integration/test_ui_e2e.py. It fails (never skips) without Node or
  # Chromium, and passes only when every spec passed, the transcript download included (plan
  # 10). It also runs the transcript browser checks: hostile turns render inert (0 requests,
  # 0 scripts) and rendered transcripts pass axe-core and the Nu HTML checker (Docker).
  assess-ui-e2e:
    name: Assess UI e2e (Playwright, axe, two origins)
    # Pinned: ubuntu-latest moved to 26.04 and Playwright 1.56 refuses it ("Playwright does not
    # support chromium on ubuntu26.04-x64"); its browser builds and --with-deps package lists
    # cover up to 24.04. Move to ubuntu-latest when the pinned Playwright supports the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Install the UI toolchain and Chromium
        working-directory: vektra-assess/ui
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run the e2e harness
        env:
          VEKTRA_ASSESS_E2E_REQUIRED: "1"
          # Playwright's results (error-context page snapshots, traces) land in the artifact
          VEKTRA_ASSESS_E2E_OUTPUT: ${{ github.workspace }}/test-results/playwright
        run: |
          mkdir -p test-results
          uv run pytest vektra-assess/tests/integration/test_ui_e2e.py \
            vektra-assess/tests/integration/test_transcript_inert_browser.py \
            vektra-assess/tests/integration/test_transcript_a11y.py -m integration \
            -v -s --tb=short --junitxml=test-results/assess-ui-e2e.xml

      - name: The e2e must have run, not skipped
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results/assess-ui-e2e.xml").getroot()
          cases = list(root.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"assess ui e2e: {len(cases)} collected, {len(skipped)} skipped")
          # the browser run, the harness heartbeat test, transcript inertness, transcript a11y
          if len(cases) != 4 or skipped:
              sys.exit(f"assess ui e2e did not run: collected={len(cases)} skipped={skipped}")
          PY

      # a failed spec: its page snapshot and trace (npx playwright show-trace <zip>)
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: assess-ui-e2e-playwright
          path: test-results/playwright/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assess-ui-e2e-test-results
          path: test-results/
          retention-days: 14

  # Aggregator, and the single required status check in branch protection. The
  # matrix reports one check per provider ("Integration tests (pgvector)", "…
  # (qdrant)"), so without a job carrying the required name the check would never
  # report and every PR would sit BLOCKED. Same pattern as ci-gate in ci-unit.yml:
  # adding a provider to the matrix, or a job like package-integration, then needs no
  # change to branch protection. The name below is load-bearing: change it and every PR
  # sits BLOCKED with all checks green.
  integration-gate:
    name: Integration tests + NFR gates
    needs: [integration, package-integration, assess-stack, assess-chaos, assess-ui-e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check every integration job passed
        run: |
          MATRIX="${{ needs.integration.result }}"
          PACKAGES="${{ needs.package-integration.result }}"
          ASSESS="${{ needs.assess-stack.result }}"
          CHAOS="${{ needs.assess-chaos.result }}"
          UI_E2E="${{ needs.assess-ui-e2e.result }}"
          if [[ "$MATRIX" != "success" ]]; then
            echo "Integration matrix did not pass (result: $MATRIX)."
            exit 1
          fi
          if [[ "$PACKAGES" != "success" ]]; then
            echo "Package integration tests did not pass (result: $PACKAGES)."
            exit 1
          fi
          if [[ "$ASSESS" != "success" ]]; then
            echo "Assess stack tests did not pass (result: $ASSESS)."
            exit 1
          fi
          if [[ "$CHAOS" != "success" ]]; then
            echo "Assess chaos tests did not pass (result: $CHAOS)."
            exit 1
          fi
          if [[ "$UI_E2E" != "success" ]]; then
            echo "Assess UI e2e did not pass (result: $UI_E2E)."
            exit 1
          fi
          echo "Integration tests passed on every vector store provider, and every package's integration suite passed."
