[project]
name = "vektra-ingest"
version = "0.1.0"
description = "Document processing pipeline for the Vektra platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_ingest"]

[tool.uv.sources]
vektra-shared = { workspace = true }
