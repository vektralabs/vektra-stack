[project]
name = "vektra-shared"
version = "0.6.0"
description = "Shared protocols and types for the Vektra platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.0",
    # test_suite_execution_coverage.py parses the workflow YAML (DEBT-031).
    # Declared here so a `uv sync --package vektra-shared` has it, rather than
    # relying on the root dev group leaking in.
    "pyyaml>=6.0.3",
]
