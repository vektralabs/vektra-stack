# Publish versioned container images to GHCR on tag push (INFRA-007).
#
# Builds both image variants from the existing Dockerfile (standard and
# INSTALL_UNSTRUCTURED=true "-ocr") and pushes them to
# ghcr.io/vektralabs/vektra. Tags are still cut manually (release.yml is a
# disabled placeholder - see "Phase 1 releases are tagged manually"); this
# workflow only reacts to the resulting v* tag, it does not create one.
name: Publish images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - variant: standard
            install_unstructured: "false"
            tag_suffix: ""
          - variant: ocr
            install_unstructured: "true"
            tag_suffix: "-ocr"

    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag (strip leading v)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tag + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/vektralabs/vektra
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}${{ matrix.tag_suffix }}
          # type=raw tags never get an automatic latest tag, but keep it
          # explicit: no `latest` tag per INFRA-007 (not requested by AC).
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            INSTALL_UNSTRUCTURED=${{ matrix.install_unstructured }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vektra-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=vektra-${{ matrix.variant }}
