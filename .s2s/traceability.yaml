  # ============================================================
  # BUSINESS RULES
  # ============================================================

  - req: BR-001
    title: "Error taxonomy: four categories"
    arch: "ARCH-020"
    plan_task: "20260217-component-shared:errors"
    test: "vektra-shared/tests/test_errors.py"
    nfr_operationalization: |
      tool: pytest (unit) + integration test in infra-ci
      dataset: each of the 13 normative error codes triggered via crafted HTTP request
      pass_condition: every error response body contains error.category as exactly one of TRANSIENT | PERMANENT | CONFIGURATION | UPSTREAM; HTTP status code matches the category mapping defined in BR-001
      environment: full Docker Compose stack (infra-docker) with PostgreSQL + vektra; executed in integration.yml CI workflow

  - req: BR-002
    title: "Phase 1 error handling scope"
    arch: "ARCH-020"
    plan_task: "20260217-feature-error-codes:error-codes-doc"
    test: ""
    nfr_operationalization: |
      tool: code review + integration test in infra-ci
      dataset: error scenarios covered by tests/test_error_codes.py
      pass_condition: no automatic retry logic present in component source (static analysis); all error paths return structured envelope with no retry headers; failing operations return complete error codes without 207 partial-success responses
      environment: linting pass (ruff/mypy) in lint.yml CI workflow; integration test confirms no retry behavior on simulated upstream failures

  - req: BR-003
    title: "Atomic ingestion in Phase 1"
    arch: "ARCH-010; ARCH-052"
    plan_task: "20260217-component-ingest:pipeline"
    test: ""
    nfr_operationalization: |
      tool: pytest integration test
      dataset: simulated ingestion failure injected at chunk storage step using mock PgvectorProvider that raises on store()
      pass_condition: after simulated failure, SELECT COUNT(*) FROM document_chunks WHERE document_id = :id returns 0; source_documents row is soft-deleted (deleted_at IS NOT NULL); ingest_jobs.status = 'failed'; no subsequent query returns results from partial document
      environment: testcontainers PostgreSQL + pgvector; in-process arq execution (no separate worker process needed)

  - req: BR-004
    title: "Document ingestion status model"
    arch: "ARCH-005; ARCH-006"
    plan_task: "20260217-component-ingest:jobs"
    test: "vektra-ingest/tests/test_pipeline.py"
    nfr_operationalization: |
      tool: pytest integration test
      dataset: real PDF ingestion through the full pipeline (sync path for files <= 10MB, async path for files > 10MB)
      pass_condition: GET /ingest/jobs/{id}/status returns exactly one of pending | processing | indexed | failed at each observable point; status never transitions backward; processing status includes a non-null phase field (extracting | chunking | embedding); failed status includes error_code from REQ-011 registry
      environment: testcontainers PostgreSQL + pgvector; in-process arq for async path

  - req: BR-005
    title: "Content hash collision with different filename"
    arch: "ARCH-032; ARCH-058"
    plan_task: "20260217-component-ingest:deduplication"
    test: ""
    nfr_operationalization: |
      tool: pytest unit + integration test
      dataset: two POST /ingest requests with identical file bytes but different filenames (e.g., document_a.pdf and document_b.pdf)
      pass_condition: second POST returns HTTP 200 with status='exists' and alias_count=1; source_documents.filename_aliases JSONB array contains both filenames; audit_log records document_aliased action with both filenames; only one row in source_documents (not two)
      environment: testcontainers PostgreSQL + pgvector; full ingest pipeline with real SHA-256 computation

  # ============================================================
  # NON-FUNCTIONAL REQUIREMENTS
  # ============================================================

  - req: NFR-001
    title: "Query latency targets"
    arch: "ARCH-036; ARCH-055"
    plan_task: "20260217-component-core:pipeline"
    test: ""
    nfr_operationalization: |
      tool: pytest-benchmark (non-blocking CI measurement per EX-004)
      dataset: 1000 queries against a corpus of 10,000 indexed chunks; 5 concurrent clients; warm state (embedding model and LLM already loaded); baseline hardware 4 CPU / 16GB RAM
      pass_condition: p95 query latency < 10s with Ollama (local), < 5s with OpenAI; >20% above target generates CI job summary warning; >50% above target generates CI job summary annotation (not a merge block per EX-004)
      environment: Docker Compose stack with vektra + postgres + ollama (local-llm profile); measured in integration.yml CI workflow after stack reaches healthy state; query latency measured from HTTP request start to full response received

  - req: NFR-002
    title: "Search latency target"
    arch: "ARCH-010; ARCH-044; ARCH-045"
    plan_task: "20260217-component-index:benchmark-search-latency"
    test: "vektra-index/tests/test_benchmark.py"
    nfr_operationalization: |
      tool: pytest-benchmark
      dataset: 10,000 document chunks indexed in pgvector (all-MiniLM-L6-v2 embeddings, 384 dimensions); 100 single-threaded search queries using randomly generated query embeddings; HNSW index pre-built
      pass_condition: p95 search latency < 500ms; actual measured result: p95 = 8.6ms (Wave 2 completion, commit 5faa71b); hard CI gate - exceeding threshold blocks merge in infra-ci integration.yml
      environment: PostgreSQL 16 + pgvector; testcontainers (real pgvector, not mocked); single-threaded baseline per NFR-002 measurement conditions; benchmark runs on GitHub Actions standard runner (2-core)

  - req: NFR-003
    title: "Ingest latency target"
    arch: "ARCH-005; ARCH-011; ARCH-037"
    plan_task: "20260217-component-ingest:benchmark-ingest-latency"
    test: ""
    nfr_operationalization: |
      tool: pytest-benchmark (non-blocking per NFR-003 TARGET classification)
      dataset: standard 10-page test PDF; text-extractable (no OCR); maximum 500KB; approximately 5000 words; cold ingest (no cached extraction result)
      pass_condition: total ingestion time from POST /ingest to status=INDEXED < 30 seconds; violation is logged as warning in CI job summary; does not block merge
      environment: Docker Compose stack with full vektra + postgres; real sentence-transformers embedding model loaded; synchronous path (< 10MB); measured end-to-end via HTTP client timing

  - req: NFR-004
    title: "Container startup time"
    arch: "ARCH-057"
    plan_task: "20260217-infra-app-entrypoint:startup-time"
    test: ""
    nfr_operationalization: |
      tool: shell timer in integration.yml CI workflow
      dataset: fresh docker compose up with cold container images already pulled (image pull time excluded); PostgreSQL reaches healthy before vektra starts
      pass_condition: time from `docker compose up -d` to GET /health returning HTTP 200 < 60 seconds; measured by polling /health every 2 seconds with a 90-second total timeout; hard CI gate - exceeding threshold blocks merge in infra-ci integration.yml
      environment: GitHub Actions runner; Docker Compose stack (postgres + vektra); all images pre-pulled; ARCH-057 8-step startup sequence must complete including embedding model warm-up

  - req: NFR-005
    title: "Data durability on graceful restart"
    arch: "ARCH-005; ARCH-010"
    plan_task: "20260217-infra-docker:data-durability"
    test: ""
    nfr_operationalization: |
      tool: manual integration test in infra-docker plan; automated verification in integration.yml
      dataset: one document ingested and confirmed INDEXED; then `docker compose restart vektra` executed (graceful SIGTERM); then POST /query with a question about the ingested document
      pass_condition: query after restart returns non-empty sources array referencing the pre-restart document_id; response answer is non-empty (LLM synthesizes from indexed chunks); hard CI gate
      environment: Docker Compose stack with named postgres volume (vektra_pgdata); vektra container restarted without postgres restart to verify persistence is in PostgreSQL, not in-memory

  - req: NFR-006
    title: "Resource ceiling (4GB RAM, 2 CPU cores)"
    arch: "ARCH-001; ARCH-002; ARCH-026"
    plan_task: "20260217-infra-docker:resource-limits"
    test: ""
    nfr_operationalization: |
      tool: docker stats observation during make demo execution (manual, TARGET classification)
      dataset: make demo complete workflow (compose up, ingest sample PDF, run query) on a system with 4GB RAM / 2 CPU cores available to Docker
      pass_condition: make demo completes end-to-end without OOM kill (docker stats shows no container exit code 137); peak memory of vektra API container stays below 2GB (includes ~500MB sentence-transformers model); violation is documented but does not block release (TARGET classification)
      environment: developer workstation or CI runner with 4GB RAM configured as Docker memory limit; postgres + vektra containers only (no ollama); memory limits enforced via Docker Compose mem_limit config per ARCH-026

  - req: NFR-007
    title: "Audit log completeness (100%)"
    arch: "ARCH-041"
    plan_task: "20260217-component-admin:audit"
    test: "vektra-ingest/tests/test_api.py"
    nfr_operationalization: |
      tool: pytest integration test in tests/test_nfr_hard.py
      dataset: 50 authenticated HTTP requests against all API endpoint categories (ingest, query, admin, index); each request uses a valid API key with admin scope
      pass_condition: SELECT COUNT(*) FROM audit_log WHERE created_at >= test_start_time = 50; no authenticated request missing from audit_log; count discrepancy of even 1 fails the test; hard CI gate that blocks merge in infra-ci integration.yml
      environment: full Docker Compose stack; real PostgreSQL audit_log table; AuditMiddleware registered on FastAPI app via infra-app-entrypoint; /health and /metrics excluded from audit log per design

  - req: NFR-008
    title: "Configurable audit log retention"
    arch: "ARCH-041"
    plan_task: "20260217-component-admin:audit"
    test: ""
    nfr_operationalization: |
      tool: startup log inspection
