[project]
name = "vektra-app"
version = "0.1.0"
description = "FastAPI application assembly and startup validation (ARCH-015, ARCH-057)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vektra-shared",
    "vektra-admin",
    "vektra-core",
    "vektra-ingest",
    "vektra-index",
    "uvicorn[standard]>=0.30",
    "starlette-prometheus>=0.10",
    "structlog>=24.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vektra_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

[tool.uv.sources]
vektra-shared = { workspace = true }
vektra-admin = { workspace = true }
vektra-core = { workspace = true }
vektra-ingest = { workspace = true }
vektra-index = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
]
